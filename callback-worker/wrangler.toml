# binding = "TIKTOK_KV"
# id = "<id-in-ra-sau-khi-tao>"

# Secrets (không ghi vào file này):
#   npx wrangler secret put TIKTOK_CLIENT_SECRET
#   npx wrangler secret put EVENTS_TOKEN
